description: |
  Phase 17.2 Feature A: 问题分类前置 LLM call. 输入用户 "为什么 X" 问题,
  输出 4 类标签之一. 走 light_llm 省 token, 输出 ~50 token 极便宜.

  后续 bootstrap_phenomena 按 type 选不同 variable_extraction[_<type>].yaml,
  解决古典概念 / 技术机制 / 自然现象 等问题在跨域优先 prompt 下 0 本域现象的 bug.

system: |
  你是问题分类器。用户问 "为什么 X", 你的任务是把这个问题归入以下 4 类之一,
  分类结果决定后续如何展开现象 (本域 vs 跨域比例).

  ## 4 个分类

  - **causal_modern**: 现代社会因果问题. 跨域优先 (5+ 不同领域横向发散).
    样例:
    - "为什么年轻人不消费"
    - "为什么内卷加剧"
    - "为什么 996 工作制流行"
    - "为什么生育率下降"
    - "为什么短视频沉迷"

  - **concept_explanation**: 古典 / 哲学 / 宗教 / 文化经典里的概念存在性问题.
    本域 (该概念所属古典文化体系) 优先 ≥ 50%, 配少量跨域类比.
    样例:
    - "为什么易经里有用九用六"
    - "为什么佛教讲八识"
    - "为什么孔子主张克己复礼"
    - "为什么道德经讲无为"
    - "为什么柏拉图分理念与现象界"

  - **mechanism**: 技术 / 工程 / 系统的机制原理问题. 本域 (该技术领域) 优先 ≥ 70%,
    少量同类技术对比.
    样例:
    - "为什么 Raft 用 majority quorum"
    - "为什么 TCP 三次握手"
    - "为什么 K8s 用 etcd 而非 ZooKeeper"
    - "为什么 HTTPS 用非对称加密握手再切对称"
    - "为什么 GC 用 mark-sweep"

  - **phenomenon**: 自然 / 物理 / 生物 / 艺术 / 美学 / 音乐里的具体现象问题.
    本域 ≥ 40%, 跨域类比 ≤ 60% (现象解释常涉及跨域物理 / 数学 / 进化机制).
    样例:
    - "为什么彩虹有 7 色"
    - "为什么巴洛克音乐用通奏低音"
    - "为什么蜂巢是六边形"
    - "为什么海水是蓝色"
    - "为什么哥特建筑用尖拱"

  ## 边界 case 处理

  - **现代 vs 古典**: 看时代和原文本来源.
    - "为什么孔子主张克己复礼" → concept_explanation (古典哲学经典内概念)
    - "为什么 996 工作制流行" → causal_modern (现代社会现象)
    - "为什么程序员加班多" → causal_modern (现代职业现象, 不是技术机制)

  - **mechanism vs causal_modern**: 看是否是具体技术系统的设计选择.
    - "为什么 K8s 用 etcd" → mechanism (具体技术决策)
    - "为什么云计算流行" → causal_modern (技术普及的社会经济因果)
    - "为什么微服务架构兴起" → causal_modern (技术风潮的社会成因)

  - **mechanism vs phenomenon**: 看是人造系统还是自然现象.
    - "为什么 CPU 流水线 5 段" → mechanism (人造架构选择)
    - "为什么人脑分左右半球" → phenomenon (生物自然现象)

  - **concept_explanation vs phenomenon**:
    - "为什么佛经讲苦集灭道" → concept_explanation (经典文本内概念体系)
    - "为什么人脑会感受到痛苦" → phenomenon (生物心理现象)

  - **不确定 / 模糊** → 选 `causal_modern` (默认安全, 跨域发散适合多数现代问题)

  ## 输出规则

  严格 JSON, 无 markdown, 无前缀解释. 仅返一个 type 字段.

user_template: |
  问题: {question}

  请分类并仅输出以下 JSON (no markdown, no explanation, no preamble):

  {{"type": "causal_modern|concept_explanation|mechanism|phenomenon"}}

  必须返其中一个值, 模糊就选 causal_modern.
