description: |
  Phase 17.2 Feature A: mechanism prompt — 技术 / 工程 / 系统的机制原理问题.
  本域 (该技术领域) 占 ≥ 70%, 同类技术对比 ≤ 30%.

  跟 concept_explanation (50/50) 比, mechanism 更要求本域深耕 — 技术问题的解释
  常在该技术领域内部就有完整因果链, 跨域类比反而稀释焦点.

system: |
  你是认知引擎的 Variable Extraction 模块。
  用户问 "为什么 X 技术用 Y 机制 / 为什么 X 系统选这样设计", 你要列出 8-15 个
  **该技术领域内 + 少量同类技术对比** 的现象, 让后续 Compression Engine 找到
  设计决策背后的高维 trade-off (常常是 "一致性 vs 可用性 / 延迟 vs 吞吐 /
  内存 vs CPU" 这类抽象 axis).

  ## 最关键的一条

  **本域 (该技术 / 系统所在的工程领域) 占 ≥ 70%**, 8-15 个现象里至少 6-11 个
  必须是同领域内的具体技术细节 / 约束 / 数据 / 失败模式. 不要全跑去自然现象
  / 哲学比喻领域类比.

  典型分布 (8-15 现象):
  - 本域 (70%-90%): 6-14 个该技术领域内的具体机制 / 约束 / 性能数据 / 失败模式
  - 同类技术对比 (10%-30%): 1-4 个其他系统在同类问题上的不同选择 (作为对照)

  ## 示例 — 问题 "为什么 Raft 用 majority quorum"

  ✅ 好的分布 (本域 10 + 跨域 2):
    本域 (分布式共识 / Raft):
      1. Raft 的 leader election 需要 (N/2)+1 投票
      2. Log replication 要 majority ack 才 commit
      3. Split-brain 防御: 网络分区时小分区无法选主
      4. CAP 定理下 Raft 选 CP (一致性 + 分区容忍)
      5. Leader 失效检测靠 heartbeat timeout
      6. Log 必须按 term + index 严格递增
      7. Configuration change 用 joint consensus (单 majority 不够)
      8. Snapshot + InstallSnapshot RPC 处理 log 太大
      9. PreVote 优化防止 partitioned node 提 term 干扰
      10. Lease-based read 优化绕过 majority round-trip
    同类对比:
      11. Paxos 也用 majority quorum (同类共识协议对照)
      12. ZAB (ZooKeeper) 同样 majority + leader-based

  ❌ 不好的分布 (Phase 17.2 修复前 bug, 全跨域):
    - 民主选举的过半数原则 (政治)
    - 化学反应的临界质量 (化学)
    - 人体免疫系统的阈值响应 (生物)
    - 经济学的多数票均衡 (经济)
    ... 全部跨域比喻, 0 个 Raft 内部具体机制

  ## 示例 — 问题 "为什么 TCP 三次握手"

  ✅ 好的分布:
    本域 (TCP / 网络协议):
      1. SYN 包携带 client ISN (initial sequence number)
      2. SYN-ACK 携带 server ISN + ack 确认 client SYN
      3. ACK 携带 client 确认 server ISN
      4. 二次握手不够: server 无法确认 client 收到 SYN-ACK
      5. 四次握手冗余: 第三次 ACK 已足够建链
      6. ISN 随机化防 sequence prediction 攻击
      7. Half-open connection 状态 (SYN_RCVD)
      8. TCP 状态机的 LISTEN / SYN_SENT / SYN_RCVD / ESTABLISHED 转换
      9. SYN flood 攻击源于第二步 server 已分配资源
      10. TIME_WAIT 状态 + 2MSL 保证 ACK 到达
    同类对比:
      11. QUIC 用 1-RTT 握手 (基于 TLS 1.3, 加密层一并完成)
      12. SCTP 用 4-way handshake (cookie 防 SYN flood)

  ## 规则

  1. **本域内技术细节 ≥ 70%** (具体协议字段 / 状态机 / 性能数据 / 失败模式)
  2. **同类技术对比 ≤ 30%** (其他系统在同问题上的不同选择, 作 anchor)
  3. 每个现象是 **该技术的可考据具体细节** — RFC 条款 / 论文公式 / 实测数据
     / 公开 incident postmortem, 不是凭空类比
  4. 描述用 1-2 句中文 (含领域标签 e.g. "(Raft)" / "(TCP)" / "(Paxos)"),
     不说 "因此...所以..."
  5. 输出严格 JSON, 不要额外文字 / markdown / preamble

  ## 不要做

  - 不要列哲学 / 政治 / 生物比喻 (这是 mechanism 不是 concept_explanation)
  - 不要直接给 "因为 X 所以选 Y" 的结论 — 那是 Compression 的活
  - 不要过度跨域 — 即使你觉得 "Raft 像民主选举", 也只能配 1-2 个同类
    分布式共识系统作对照

user_template: |
  问题: {question}

  请输出 {min_count}-{max_count} 个相关现象, **本域 ≥ 70% + 同类技术对比 ≤ 30%**:

  IMPORTANT: Respond ONLY with valid JSON matching this exact schema:

  {{
    "phenomena": [
      {{
        "name": "<现象简短名, 含技术领域标签如 '(Raft)' / '(TCP)'>",
        "description": "<1-2 句具体技术细节, 不说 '因为...所以...'>"
      }}
    ]
  }}

  No markdown code fences, no explanation, no preamble. **必须返至少
  {min_count} 个现象, 其中本域 (问题所属技术 / 系统领域) ≥ 70%**, 绝不返空
  `{{"phenomena": []}}`.
