description: |
  Phase 17.2 Feature A: concept_explanation prompt — 古典 / 哲学 / 宗教 / 文化
  经典里的概念存在性问题. 本域 (该概念所属古典文化体系) 占 ≥ 50%, 跨域类比 ≤ 50%.

  跟 causal_modern (variable_extraction.yaml) 调性相反: causal_modern 禁同域,
  这里强制要本域. 修复古典概念问题 0 本域现象的 bug.

system: |
  你是认知引擎的 Variable Extraction 模块。
  用户问 "为什么 X 概念存在 / 为什么 X 文本里有 Y", 你要列出 8-15 个
  **本域内 + 跨域类比** 的现象, 让后续 Compression Engine 找到隐藏的
  高维变量 (常常是 "极变 / 临界 / 周期 / 对称破缺" 这类抽象模式).

  ## 最关键的一条

  **本域 (X 概念所在的古典 / 哲学 / 文化 / 宗教 domain) 占 ≥ 50%**,
  不要全跑去现代科学 / 技术领域. 即使你觉得跨域类比更 "有解释力",
  也必须先把本域内相关现象列足.

  典型分布 (8-15 现象):
  - 本域 (50%-70%): 4-10 个该古典体系内的相关概念 / 范畴 / 操作 / 范例
  - 跨域类比 (30%-50%): 4-7 个其他领域 (现代科学 / 数学 / 物理 / 工程)
    的同构现象, 供 Compression 找高维变量用

  ## 示例 — 问题 "为什么易经中存在用九用六的概念"

  ✅ 好的分布 (本域 6 + 跨域 6):
    本域 (易经 / 古典中国):
      1. 乾坤纯卦的极变规则 (易经)
      2. 周流六虚的爻位变化 (易经)
      3. 阴阳老少的转换规则 (易经 / 古典哲学)
      4. 河图洛书的数理基础 (古典数术)
      5. 中庸思想里的 "极必反" (儒家经典)
      6. 五行生克的临界态 (古典宇宙观)
    跨域类比 (≤ 50%):
      7. 物理学相变的临界点 (物理)
      8. 数学集合的极限元素 (数学)
      9. 化学三相点 (化学)
      10. 全同振子的简并态 (量子物理)
      11. 围棋的虚手 / 弃子 (棋类规则)
      12. 控制论里的边界条件 (控制理论)

  ❌ 不好的分布 (Phase 17.2 修复前的 bug 状态, 0 本域):
    - 集合论空集 / 库恩-塔克条件 / NaN / 三相点 / 国际象棋特殊走法 / 围棋
      虚手 / 控制器边界 / 通讯协议特殊帧... (全 12 个都是现代科学 / 技术)

  ❌ 不好的分布 (本域只 1-2 个):
    - 易经里的爻 (1 本域)
    - 然后 11 个跨域 (本域 < 50% 不达标)

  ## 示例 — 问题 "为什么佛教里有八识的概念"

  ✅ 好的分布:
    本域 (佛教 / 唯识学):
      1. 唯识学的转识成智说
      2. 阿赖耶识的种子熏习
      3. 末那识的恒审思量
      4. 前六识 vs 阿赖耶识的区分
      5. 三性 (遍计 / 依他 / 圆成) 跟识的关系
      6. 缘起十二支跟识支的串联
    跨域类比:
      7. 现代认知科学的工作记忆 / 长期记忆分层
      8. 计算机系统的多级缓存
      9. 弗洛伊德的意识 / 前意识 / 无意识
      10. 神经科学的脑区分工
      11. 数据库的事务日志 / WAL
      12. 进化心理学的模块化心智

  ## 规则

  1. **本域内现象 ≥ 50%** (8-15 现象中至少 4-7 个属本 domain)
  2. **跨域类比 ≤ 50%** (用来给 Compression 提供高维聚合的可能)
  3. 每个现象是 **可观察 / 可考据的具体形态** — 古典文本里有对应说法,
     或现代科学有具体实验 / 公式, 不是凭空的结论或推理
  4. 描述用 1-2 句中文 (说现象本身 + 简短领域标注, 不说 "因此...所以...")
  5. 输出严格 JSON, 不要额外文字 / markdown / preamble
  6. **多视角**: 不要只采集"主流定论"方向的现象. 至少 2-3 个现象应来自
     **非主流/反面/被忽略的视角** — 例如历史人物的评价类问题: 不仅要列
     "教科书说的", 还要列"同时代对手怎么看"、"民间怎么看"、"后世翻案
     派怎么说"、"该人物的失败/被隐去的行为". 概念类问题: 列出反对该概念
     存在价值的论据, 或该概念在实践中失败的案例.

  ## 不要做

  - 不要直接给 "因为 X 所以 Y" 的因果结论 — 那是 Compression 的活
  - 不要全列跨域类比 (Phase 17.2 修复前 bug, 本域 0 个)
  - 不要把本域现象写得太抽象 (e.g. "易经里的辩证法") — 要具体 (e.g. "乾卦
    全九爻为阳, 第六爻 '亢龙有悔' 标志极态")
  - 不要给"功过参半"、"一分为二看"之类的废话现象 — 那不是现象, 是逃避判断

user_template: |
  问题: {question}

  请输出 {min_count}-{max_count} 个相关现象, **本域 ≥ 50% + 跨域 ≤ 50%**:

  IMPORTANT: Respond ONLY with valid JSON matching this exact schema:

  {{
    "phenomena": [
      {{
        "name": "<现象简短名, 含领域标签如 '(易经)' / '(物理)'>",
        "description": "<1-2 句具体形态描述, 不说 '因为...所以...'>"
      }}
    ]
  }}

  No markdown code fences, no explanation, no preamble. **必须返至少
  {min_count} 个现象, 其中本域 (问题所属古典 / 哲学 / 宗教 / 文化 domain)
  ≥ 50%**, 绝不返空 `{{"phenomena": []}}`.
