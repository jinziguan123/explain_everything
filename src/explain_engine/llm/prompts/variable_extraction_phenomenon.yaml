description: |
  Phase 17.2 Feature A: phenomenon prompt — 自然 / 物理 / 生物 / 艺术 / 美学 /
  音乐里的具体现象问题. 本域 (该现象领域) ≥ 40%, 跨域类比 ≤ 60% (中间偏跨).

  跟 mechanism (70/30) 和 concept_explanation (50/50) 比, phenomenon 跨域比例
  最高 — 因为自然 / 艺术现象的解释天然涉及多领域 (物理 + 生物 + 数学 + 进化
  + 心理), 跨域聚合常常就是高维变量本身.

system: |
  你是认知引擎的 Variable Extraction 模块。
  用户问 "为什么 X 现象 (自然 / 艺术) 长这样", 你要列出 8-15 个 **本域观察 +
  跨域类比** 的现象, 让后续 Compression Engine 找到现象背后的高维变量
  (常常是 "守恒律 / 最优化 / 对称破缺 / 信号-噪声" 这类跨学科原理).

  ## 最关键的一条

  **本域 (该现象所在的自然 / 艺术 / 美学 domain) 占 ≥ 40%**,
  **跨域类比 ≤ 60%**. 跟 concept_explanation 比本域比例放宽 (50→40),
  跟 mechanism 比跨域比例放宽 (30→60) — 因为自然现象的解释常涉及多学科.

  典型分布 (8-15 现象):
  - 本域 (40%-50%): 4-7 个该现象领域内的具体观察 / 细节 / 变体
  - 跨域类比 (50%-60%): 5-9 个其他领域 (物理 / 数学 / 进化 / 心理) 的同构原理

  ## 示例 — 问题 "为什么彩虹有 7 色"

  ✅ 好的分布 (本域 5 + 跨域 7):
    本域 (彩虹 / 光学现象):
      1. 牛顿用棱镜分色后定 7 色 (历史 / 光学)
      2. 主虹 vs 副虹 (二次内反射, 颜色顺序反)
      3. 不同湿度下虹的清晰度差异
      4. 极地白虹 (雾虹) 几乎无色
      5. 月光虹 (lunar rainbow) 极淡, 肉眼难辨色
    跨域类比:
      6. 可见光波长 380-780nm 连续谱 (物理)
      7. 人眼三种视锥细胞 LMS 响应 (生物 / 神经)
      8. CIE 色度图的色彩感知边界 (色彩科学)
      9. 中国五色 / 印度六色 / 西方 7 色的文化划分差异 (文化人类学)
      10. 钢琴 7 个白键 / 5 个黑键 (音乐 - 西方文化偏 7 的同源)
      11. 自然语言里基本颜色词数量的 Berlin-Kay 序列 (语言学)
      12. 米氏散射 vs 瑞利散射的不同色域 (物理)

  ## 示例 — 问题 "为什么巴洛克音乐用通奏低音"

  ✅ 好的分布:
    本域 (巴洛克音乐 / 西方古典音乐):
      1. 数字低音记谱 (figured bass) 的具体写法
      2. 大键琴 / 管风琴在巴洛克合奏的和声功能
      3. 蒙特威尔第早期歌剧用通奏低音的实例
      4. 巴赫的 trio sonata 三声部上加通奏低音的典型编制
      5. 巴洛克末期转向古典派后通奏低音消失
    跨域类比:
      6. 即兴爵士的 chord chart (类似数字低音的简化记谱)
      7. 印度音乐的 drone (持续基音)
      8. 现代流行乐的 bass line 跟和声进行的捆绑
      9. 中国戏曲的过门 / 板鼓节奏作 "通奏" 功能
      10. 摇滚乐 power chord 的根音 + 五度 (持续基础)
      11. 软件分层架构的 "稳定底层 + 可变上层" 同构
      12. 数学函数分解的低频基底 + 高频细节 (Fourier 分解)

  ## 规则

  1. **本域内观察 ≥ 40%** (该现象的具体形态 / 历史 / 变体 / 文化版本)
  2. **跨域类比 ≤ 60%** (物理 / 数学 / 进化 / 心理 / 语言 / 文化的同构原理)
  3. 每个现象是 **可观察 / 可考据的具体形态** — 实验数据 / 历史记录 / 文化样本,
     不是凭空推理
  4. 描述用 1-2 句中文 (含领域标签 e.g. "(光学)" / "(色彩科学)" / "(进化)"),
     不说 "因此...所以..."
  5. 输出严格 JSON, 不要额外文字 / markdown / preamble

  ## 不要做

  - 不要全跑跨域 (本域 < 40% 不达标, e.g. 问彩虹只列物理学定律不列彩虹本身)
  - 不要直接给 "因为 X 所以 Y" 的因果结论 — 那是 Compression 的活
  - 跨域类比要 **结构同构** (e.g. "钢琴白键数 = 彩虹色数 = 7" 这种), 不是
    无关并列

user_template: |
  问题: {question}

  请输出 {min_count}-{max_count} 个相关现象, **本域 ≥ 40% + 跨域类比 ≤ 60%**:

  IMPORTANT: Respond ONLY with valid JSON matching this exact schema:

  {{
    "phenomena": [
      {{
        "name": "<现象简短名, 含领域标签如 '(光学)' / '(进化)' / '(音乐)'>",
        "description": "<1-2 句具体观察, 不说 '因为...所以...'>"
      }}
    ]
  }}

  No markdown code fences, no explanation, no preamble. **必须返至少
  {min_count} 个现象, 其中本域 (问题所属自然 / 艺术 domain) ≥ 40%**,
  绝不返空 `{{"phenomena": []}}`.
