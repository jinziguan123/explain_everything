[project]
name = "explain-engine"
version = "0.0.1"
description = "Cognitive Engine for explanation-centric reasoning"
readme = "README.md"
authors = [
    { name = "jinziguan", email = "18917950960@163.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.100.0",
    "fastapi>=0.115",       # Web frontend Task A1: FastAPI 服务层
    "flagembedding>=1.3",   # Phase 13: BGE-M3 wrapper (Candidate E)
    "graphviz>=0.20",
    "httpx>=0.25",          # Phase 20.0 Task 1 follow-up: 直接依赖 (anthropic/openai 也 bundle 但显式声更稳)
    "networkx>=3.5",
    "openai>=2.36.0",
    "pgvector>=0.3",        # Phase 17.1: psycopg adapter for vector type
    "prompt-toolkit>=3.0.52",
    "psycopg[binary,pool]>=3.2",  # Phase 17.1: PostgreSQL client (async + sync pool)
    "pyfiglet>=1.0",        # Phase 19: SplashScreen ASCII logo (Wave 6)
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sse-starlette>=2.1",   # Web frontend Task A1: SSE 流式输出 (后续 task 用)
    "tenacity>=9.1.4",
    "textual>=0.50",        # Phase 19: TUI framework (Wave 3+)
    "torch>=2.1",           # Phase 13: MPS backend for BGE-M3
    "typer>=0.25.1",
    "uvicorn[standard]>=0.30",  # Web frontend Task A1: ASGI server
]

[project.scripts]
explain = "explain_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explain_engine"]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: 需要真实 LLM API 的集成测试，CI 默认跳过",
    "embedding: 需要 BGE-M3 model (4.3GB local) + MPS GPU, CI 默认跳过",
]
addopts = "-m 'not integration and not embedding'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude", "docs/plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# E501: 行长由 line-length=100 控制，更柔性
# RUF001-003: 中文标点（， 。 ： ）在 docstring/comment 里是 intentional，不算错
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
