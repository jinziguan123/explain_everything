[project]
name = "explain-engine"
version = "0.0.1"
description = "Cognitive Engine for explanation-centric reasoning"
readme = "README.md"
authors = [
    { name = "jinziguan", email = "18917950960@163.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.100.0",
    "graphviz>=0.20",
    "networkx>=3.5",
    "openai>=2.36.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.25.1",
]

[project.scripts]
explain = "explain_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explain_engine"]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: 需要真实 LLM API 的集成测试，CI 默认跳过",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude", "docs/plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# E501: 行长由 line-length=100 控制，更柔性
# RUF001-003: 中文标点（， 。 ： ）在 docstring/comment 里是 intentional，不算错
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
