[project]
name = "explain-agent"
version = "0.1.0"
description = "A 股板块/主题异动归因 AI agent"
readme = "README.md"
authors = [
    { name = "jinziguan", email = "18917950960@163.com" }
]
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.60",
    "anthropic>=0.100.0",
    "clickhouse-connect>=0.15.1",
    "cryptography>=48.0.0",
    "httpx>=0.28.1",
    "langgraph>=1.1.10",
    "openai>=2.36.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymysql>=1.1.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.17.1",
    "rich>=15.0.0",
    "sentence-transformers>=5.4.1",
    "sqlalchemy>=2.0.49",
    "tenacity>=9.1.4",
    "typer>=0.25.1",
]

[project.scripts]
explain-ingest-news = "explain_agent.cli.ingest_news:app"
explain = "explain_agent.cli.repl.loop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
markers = [
    "integration: 需要真实数据库/网络的集成测试，CI 默认跳过",
    "slow: 较慢的测试（模型加载、大批量数据）",
]
addopts = "-m 'not integration'"

